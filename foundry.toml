[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.6.2"
optimizer = true
optimizer_runs = 200
# The echidna/halmos wrappers install the npm packages and rewrite `@scope/pkg/`
# imports to relative node_modules paths before compiling, so no remappings are
# needed here.
remappings = []
